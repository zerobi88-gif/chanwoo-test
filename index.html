  <script>
const cases = Array.isArray(window.CASES) ? window.CASES : [];
const searchInput = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const resultCount = document.getElementById('resultCount');
const filtersEl = document.getElementById('categoryFilters');
const quickEl = document.getElementById('quickKeywords');
const dialog = document.getElementById('detailDialog');
const dialogContent = document.getElementById('dialogContent');
const dialogClose = document.getElementById('dialogClose');
let category = '전체';

const normalize = (s='') => String(s).toLowerCase().replace(/\s+/g,'').replace(/[()·/,_-]/g,'');
const escapeHtml = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function searchableText(item){
  return [item.memoNo,item.title,item.category,item.diagnosisCode,item.procedureCode,item.conclusion,...item.keywords,...item.coverage,...item.checkpoints].join(' ');
}
function score(item, q){
  if(!q) return 1;
  const nq=normalize(q), title=normalize(item.title), all=normalize(searchableText(item));
  if(title===nq) return 100;
  if(title.startsWith(nq)) return 70;
  if(title.includes(nq)) return 50;
  if(normalize(item.diagnosisCode)===nq || normalize(item.procedureCode)===nq) return 60;
  if((item.keywords||[]).some(k=>normalize(k)===nq)) return 45;
  if(all.includes(nq)) return 20;
  const parts=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return parts.length && parts.every(p=>searchableText(item).toLowerCase().includes(p)) ? 10 : 0;
}
function highlight(text,q){
  const safe=escapeHtml(text||'');
  if(!q.trim()) return safe;
  const tokens=q.trim().split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);
  return tokens.reduce((acc,t)=>{
    const e=t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return acc.replace(new RegExp(`(${e})`,'gi'),'<mark>$1</mark>');
  },safe);
}
function render(){
  const q=searchInput.value.trim();
  let list=cases.map(item=>({item,s:score(item,q)})).filter(x=>x.s>0);
  if(category!=='전체') list=list.filter(x=>x.item.category===category);
  list.sort((a,b)=>b.s-a.s || (a.item.memoNo||'').localeCompare(b.item.memoNo||''));
  resultCount.textContent=list.length;
  if(!list.length){
    resultsEl.innerHTML=`<div class="empty"><strong>검색 결과가 없습니다.</strong><p>현재 복원된 보험메모 DB에는 해당 자료가 아직 등록되지 않았습니다.</p></div>`;
    return;
  }
  resultsEl.innerHTML=list.map(({item})=>`
    <article class="card" data-id="${escapeHtml(item.id)}" tabindex="0" role="button" aria-label="${escapeHtml(item.title)} 상세보기">
      <div class="card-top"><div class="badges">${item.memoNo?`<span class="badge memo">${escapeHtml(item.memoNo)}</span>`:''}<span class="badge">${escapeHtml(item.category)}</span></div><span class="open-icon">↗</span></div>
      <h3>${highlight(item.title,q)}</h3>
      <div class="codes">${item.diagnosisCode?`<span class="code">진단 ${highlight(item.diagnosisCode,q)}</span>`:''}${item.procedureCode?`<span class="code">수술 ${highlight(item.procedureCode,q)}</span>`:''}</div>
      <p class="conclusion">${highlight(item.conclusion,q)}</p>
      <div class="coverage">${item.coverage.slice(0,3).map(v=>`<span>${highlight(v,q)}</span>`).join('')}${item.coverage.length>3?`<span>+${item.coverage.length-3}</span>`:''}</div>
    </article>`).join('');
}
function setupFilters(){
  const cats=['전체',...new Set(cases.map(x=>x.category))];
  filtersEl.innerHTML=cats.map(c=>`<button class="${c==='전체'?'active':''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  filtersEl.addEventListener('click',e=>{
    const btn=e.target.closest('button[data-category]'); if(!btn) return;
    category=btn.dataset.category;
    [...filtersEl.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b===btn));
    render();
  });
}
function setupQuick(){
  const words=['백내장','치핵','S93','CT','맘모톰','뇌동맥류','태풍'];
  quickEl.innerHTML=words.map(w=>`<button data-q="${w}">${w}</button>`).join('');
  quickEl.addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(!b)return;searchInput.value=b.dataset.q;category='전체';setupActiveAll();render();searchInput.focus();});
}
function setupActiveAll(){[...filtersEl.querySelectorAll('button')].forEach(b=>b.classList.toggle('active',b.dataset.category==='전체'));}
function openDetail(id){
  const item=cases.find(x=>x.id===id); if(!item) return;
  dialogContent.innerHTML=`<div class="detail">
    <div class="category">${escapeHtml(item.category)} ${item.memoNo?`· ${escapeHtml(item.memoNo)}`:''}</div>
    <h2>${escapeHtml(item.title)}</h2>
    <div class="source">SOURCE · ${escapeHtml(item.source)}</div>
    <div class="detail-grid">
      <div class="detail-box"><span>진단코드</span><strong>${escapeHtml(item.diagnosisCode||'—')}</strong></div>
      <div class="detail-box"><span>수술·처치코드</span><strong>${escapeHtml(item.procedureCode||'—')}</strong></div>
    </div>
    <div class="section"><h4>보상 결론</h4><p>${escapeHtml(item.conclusion)}</p></div>
    <div class="section"><h4>관련 담보</h4><div class="tag-row">${item.coverage.map(v=>`<span>${escapeHtml(v)}</span>`).join('')}</div></div>
    <div class="section"><h4>실무 체크포인트</h4><ul>${item.checkpoints.map(v=>`<li>${escapeHtml(v)}</li>`).join('')}</ul></div>
    <div class="section"><h4>검색 키워드</h4><div class="tag-row">${item.keywords.map(v=>`<span>${escapeHtml(v)}</span>`).join('')}</div></div>
  </div>`;
  dialog.showModal();
}
searchInput.addEventListener('input',render);
document.addEventListener('keydown',e=>{if(e.key==='/' && document.activeElement!==searchInput){e.preventDefault();searchInput.focus();} if(e.key==='Escape'&&dialog.open)dialog.close();});
resultsEl.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openDetail(c.dataset.id);});
resultsEl.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openDetail(e.target.dataset.id);}});
dialogClose.addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
setupFilters();setupQuick();render();

</script>
